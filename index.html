<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <h1>🪨 Stone 📄 Paper ✂️ Scissors</h1>

        <p class="subtitle">Choose your move!</p>

        <div class="choices">
            <button onclick="playGame('stone')">🪨 Stone</button>
            <button onclick="playGame('paper')">📄 Paper</button>
            <button onclick="playGame('scissors')">✂️ Scissors</button>
        </div>

        <div class="result-box">

            <p>You chose: <span id="userChoice">-</span></p>

            <p>Computer chose: <span id="computerChoice">-</span></p>

            <h2 id="result">Make your choice!</h2>

        </div>

        <div class="score">
            <p>👤 Your Score: <span id="userScore">0</span></p>
            <p>💻 Computer Score: <span id="computerScore">0</span></p>
        </div>

        <button class="reset" onclick="resetGame()">🔄 Reset Game</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
